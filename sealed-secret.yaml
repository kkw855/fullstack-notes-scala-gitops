---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: notes-app-secrets
  namespace: notes-scala
  annotations:
    # migration job(PreSync, wave 0)이 DB_USER/DB_PASSWORD 환경변수로 참조하므로 먼저 생성되어야 함
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    DB_PASS: 
    DB_USER: 
    REDIS_PASS: 
  template:
    metadata:
      name: notes-app-secrets
      namespace: notes-scala
    type: Opaque
